# Three services, plus one that is off by default. `whatsapp-transport` speaks
# WhatsApp's multi-device protocol (Go, whatsmeow) and is the ONLY way this
# system reaches WhatsApp — the browser driver it replaced is gone.
# `whatsapp-bridge` owns the archive and is its only writer. `agent` is the eve
# agent; its tools call the bridge and nothing else. `frameforge` renders
# documents, holds no credential, and starts only under `--profile frameforge`.
services:
  # Speaks WhatsApp's multi-device protocol directly (Go, whatsmeow) and queues
  # what arrives in a durable outbox. The bridge drains that queue into the
  # archive; the agent never talks to this service.
  #
  # REQUIRED, not optional. The DOM path this used to fall back to was deleted:
  # with WA_TRANSPORT_TOKEN unset the transport refuses to start and the bridge
  # has no way to receive or send anything at all. There is no "as before".
  whatsapp-transport:
    build: ./whatsapp-transport
    restart: unless-stopped
    environment:
      # No default and no fallback. This API can read every message the account
      # receives and send as the operator, so the process refuses to start
      # unauthenticated rather than expose that to anything on the host.
      WA_TRANSPORT_TOKEN: "${WA_TRANSPORT_TOKEN:?generate one with openssl rand -hex 32}"
      # 0.0.0.0 INSIDE the container only. The binary defaults to 127.0.0.1 —
      # correct when run bare, but unreachable from the bridge's container. What
      # keeps it off the network is the loopback-only host mapping below, not this.
      WA_TRANSPORT_ADDR: "0.0.0.0:8100"
      WA_TRANSPORT_DIR: "/data"
      # Sending is default-deny here as well as in the bridge. Two independent
      # gates, deliberately not sharing WA_ALLOW_SEND: defence in depth is only
      # depth if each layer is configured on purpose. Note the allowlist here is
      # written as JIDs, not names — see GET /contacts.
      WA_TRANSPORT_ALLOW_SEND: "${WA_TRANSPORT_ALLOW_SEND:-false}"
      WA_TRANSPORT_SEND_ALLOWLIST: "${WA_TRANSPORT_SEND_ALLOWLIST:-}"
      # How many messages the outbox holds before it starts discarding the
      # oldest. The default is 50,000; the count of what was dropped is
      # cumulative and reported on every drain, because a gap must never be
      # inferrable only from an archive that looks quiet.
      WA_TRANSPORT_OUTBOX_CAPACITY: "${WA_TRANSPORT_OUTBOX_CAPACITY:-}"
      WA_TRANSPORT_LOG_LEVEL: "${WA_TRANSPORT_LOG_LEVEL:-INFO}"
    volumes:
      # The paired session and the outbox. This volume IS the account credential,
      # exactly like whatsapp-profile — copying it hands someone the account.
      - whatsapp-transport-data:/data
    expose:
      - "8100"
    ports:
      # Loopback ONLY, for the same reason as the bridge: pairing needs host
      # access (GET /pair/qr, POST /pair/phone) and every other route sends or
      # reads as the operator. Do not bind 0.0.0.0 and do not tunnel this.
      - "127.0.0.1:8100:8100"
    networks:
      - internal

  whatsapp-bridge:
    build: ./whatsapp-bridge
    restart: unless-stopped
    environment:
      # Quoted: an unquoted ${VAR:?message} whose message contains ": " parses
      # as a nested mapping and breaks the whole file.
      WA_BRIDGE_TOKEN: "${WA_BRIDGE_TOKEN:?generate one with openssl rand -hex 32}"
      # Sending stays off unless explicitly enabled, and an empty allowlist
      # permits no one. Both defaults fail closed.
      WA_ALLOW_SEND: "${WA_ALLOW_SEND:-false}"
      WA_SEND_ALLOWLIST: "${WA_SEND_ALLOWLIST:-}"
      # Nicknames the user actually says ("tonhão"), mapped to the chat name
      # WhatsApp shows. A lookup convenience only — the resolved name still
      # has to be on the allowlist.
      WA_CONTACT_ALIASES: "${WA_CONTACT_ALIASES:-}"
      # Self-notes: the agent writing to your own chat, for you to copy and
      # paste. There is no allowlist because there is only one possible
      # recipient — but the bridge must be told exactly which chat is yours, and
      # writes nothing at all until it is. That unset default is the real gate;
      # WA_ALLOW_SELF_NOTE only exists to switch the feature off entirely.
      WA_SELF_CHAT_NAME: "${WA_SELF_CHAT_NAME:-}"
      WA_ALLOW_SELF_NOTE: "${WA_ALLOW_SELF_NOTE:-true}"
      # The archive of ingested messages. Defaults to /data/store.db in the
      # image, so it lands on the volume rather than inside a container layer.
      WA_STORE_PATH: "${WA_STORE_PATH:-/data/store.db}"
      # UTC. Inside it the bridge reads nothing and reports nothing — a self-note
      # is itself an interaction. Unset means no quiet hours, which is a choice.
      WA_QUIET_HOURS: "${WA_QUIET_HOURS:-23:00-07:00}"
      # Where to drain messages from. Unset means "there is no transport", and
      # since the browser path was removed that leaves the bridge inert: every
      # /transport/* route answers 503 and nothing is received or sent.
      WA_TRANSPORT_URL: "${WA_TRANSPORT_URL:-}"
      # The same secret the transport refuses to start without. Not defaulted from
      # WA_BRIDGE_TOKEN: two services sharing one token means rotating either one
      # silently unauthenticates the other.
      WA_TRANSPORT_TOKEN: "${WA_TRANSPORT_TOKEN:-}"
      WA_TRANSPORT_DRAIN_INTERVAL_MS: "${WA_TRANSPORT_DRAIN_INTERVAL_MS:-5000}"
      # Reactive /eve: the bridge posts what the operator typed straight to the
      # agent instead of leaving it for a poll. Unset means the queue still fills
      # and /self/pending still serves it — the feature degrades to polling
      # rather than breaking.
      WA_AGENT_URL: "${WA_AGENT_URL:-}"
      WA_CONSOLE_PUSH_TOKEN: "${WA_CONSOLE_PUSH_TOKEN:-}"
    volumes:
      # The archive. Holds store.db — every message ingested, the interaction
      # twin, people and obligations. Named `whatsapp-profile` for its history:
      # it used to hold the browser profile, which WAS the linked session. That
      # credential now lives in whatsapp-transport-data; this volume is your
      # correspondence, which is worth no less.
      - whatsapp-profile:/data
    expose:
      - "8099"
    ports:
      # Loopback ONLY. You need host access to fetch /qr and to check /status,
      # and every route but /health requires the bearer token. Binding this to
      # 0.0.0.0 would put a live WhatsApp account on the network, so the
      # 127.0.0.1 prefix is not optional — do not tunnel this port either.
      - "127.0.0.1:8099:8099"
    networks:
      - internal

  # The document renderer. Optional, and off by default: it starts only with
  # `--profile frameforge`, so a stack that never makes a poster never runs it.
  #
  # The image is built from the FrameForge checkout, which is a different
  # repository — `make docker-build` there, or set WA_FRAMEFORGE_IMAGE to a tag
  # you already have. Its own distribution speaks stdio; the command below runs
  # the same server over HTTP, which is what an MCP client connection needs.
  #
  # It touches no WhatsApp credential and reaches no network but this one. What
  # it shares with the agent is `frameforge-work`: renders land in
  # /work/sessions/<id>/ and the agent reads them back from the same path, so a
  # rendered page can be sent without a second copy over the wire.
  frameforge:
    image: "${WA_FRAMEFORGE_IMAGE:-frameforge:latest}"
    profiles:
      - frameforge
    restart: unless-stopped
    # The stock image speaks stdio and binds localhost. scripts/frameforge-http.py
    # is the one launcher that asks FastMCP for its HTTP transport — the same file
    # used to run this outside compose — and the image's entrypoint runs a
    # `python ...` command inside its own venv.
    #
    # `--host 0.0.0.0` is every interface INSIDE this container, and this service
    # publishes no port and sits on the internal network, so "every interface"
    # here is narrower than the host-gateway bind the script defaults to. That is
    # what ALLOW_ANY is acknowledging; do not copy it to a host-run server.
    #
    # `--allowed-host` names what callers actually dial. The bind address and the
    # Host header differ here, and the SDK's DNS-rebinding check reads the header:
    # without this, every call is refused with a 421 the client reports as a
    # broken socket rather than as a refusal.
    command:
      - python
      - /opt/frameforge/frameforge-http.py
      - --host=0.0.0.0
      - --port=8110
      - --allowed-host=frameforge:8110
    environment:
      FRAMEFORGE_HTTP_ALLOW_ANY: "yes"
      # Where renders are written. The image's own default, restated because the
      # agent's WA_FRAMEFORGE_SESSION_ROOT must agree with it exactly.
      FRAMEFORGE_MCP_SESSION_ROOT: "/work/sessions"
    volumes:
      - frameforge-work:/work
      # Read-only: the launcher is this stack's wiring, not the image's.
      - ./scripts/frameforge-http.py:/opt/frameforge/frameforge-http.py:ro
    expose:
      - "8110"
    # Deliberately NOT published to the host: this runs model-authored Python in
    # a subprocess, so its only reachable surface is this internal network.
    healthcheck:
      # The image's own healthcheck imports a module this version renamed, and a
      # TCP probe is the honest question anyway: is the HTTP server listening?
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8110), 3).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  agent:
    build: .
    restart: unless-stopped
    depends_on:
      whatsapp-bridge:
        condition: service_healthy
    environment:
      # Which model the agent runs on. The id must exist in agent/lib/model.ts,
      # which carries its context window and parameter support — the guards are
      # fractions of that window, so an unlisted model has no guards and the
      # agent refuses to boot rather than guess.
      WA_MODEL_ID: "${WA_MODEL_ID:-}"
      # Both providers' keys: the registry decides which one is used. Anthropic
      # is no longer required for the agent to run, so it no longer fails boot.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      WA_BRIDGE_URL: "http://whatsapp-bridge:8099"
      WA_BRIDGE_TOKEN: "${WA_BRIDGE_TOKEN:?set WA_BRIDGE_TOKEN in .env}"
      # ── How long a turn may take before the runtime runs it a SECOND time ──
      #
      # eve's local world delivers a queued turn by POSTing it to this same
      # process and awaiting the handler's entire HTTP response. Both undici
      # timeouts on that request default to 30_000 ms — and a turn is not an HTTP
      # request, it is a model thinking with tools. Every turn slower than that
      # had its delivery abandoned mid-flight, was REDELIVERED, and was executed
      # again while the first execution was still running:
      #
      #   11:52:50 started · 11:53:21 'Queue delivery failed at the transport
      #   (loop 2), retrying' · 11:53:26 're-executing inline steps' ·
      #   11:53:28 answered in 37.9s · 11:53:33 answered again
      #
      # The user paid for two runs and read two different answers to one
      # question. Ten minutes is above any turn this agent has taken (the
      # slowest observed is a render at ~2 min) and far below the queue's own
      # 256-attempt backstop.
      #
      # This does not make delivery exactly-once — nothing does; the contract is
      # at-least-once. `agent/lib/delivery-guard.ts` is what makes a redelivery
      # harmless. This is what makes it rare.
      WORKFLOW_LOCAL_HEADERS_TIMEOUT_MS: "${WORKFLOW_LOCAL_HEADERS_TIMEOUT_MS:-600000}"
      WORKFLOW_LOCAL_BODY_TIMEOUT_MS: "${WORKFLOW_LOCAL_BODY_TIMEOUT_MS:-600000}"
      # The UI gate. An agent that can read and send your WhatsApp must never
      # be reachable without a password, so the channel throws when this is unset.
      WA_UI_PASSWORD: "${WA_UI_PASSWORD:?set WA_UI_PASSWORD in .env}"
      WA_UI_USERNAME: "${WA_UI_USERNAME:-me}"
      # Where the web UI's Preferences screen writes.
      #
      # Unset — or with the mount below removed — Preferences is read-only: it
      # still reports every setting and whether the running process agrees with
      # the file, and every Save is refused with a message saying why. That is
      # the correct posture for a deployment that does not want its
      # configuration editable through a browser, and it is a supported state
      # rather than a broken one.
      WA_ENV_FILE: "${WA_ENV_FILE:-/app/.env}"
      # The bridge's push route. Its own secret, deliberately not WA_UI_PASSWORD:
      # this grants "the user said this", never a login to the agent's UI.
      WA_CONSOLE_PUSH_TOKEN: "${WA_CONSOLE_PUSH_TOKEN:-}"
      # Voice-note transcription runs from the agent, not the bridge. Unset
      # leaves voice notes listed but unreadable, which is a working state.
      # Unset URL leaves voice notes listed but unread, which is a working
      # state — so this does NOT use ${VAR:?} and refuse to start.
      # Speech synthesis, for voice notes. ElevenLabs is preferred when its key
      # is present — it is the difference between a voice and a narrator — and
      # OpenAI is the fallback. Neither set means voice notes are unavailable,
      # which is a working state: nothing else depends on them.
      # Three spellings are in circulation; all are read, first non-empty wins.
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"
      ELEVEN_LABS_API_KEY: "${ELEVEN_LABS_API_KEY:-}"
      XI_API_KEY: "${XI_API_KEY:-}"
      # The id of a voice on your ElevenLabs account, NOT its display name.
      # GET https://api.elevenlabs.io/v1/voices lists them.
      WA_ELEVENLABS_VOICE_ID: "${WA_ELEVENLABS_VOICE_ID:-}"
      # A voice NAME works too, resolved against the account (a unique prefix is
      # enough). An ambiguous one is refused rather than guessed.
      WA_ELEVENLABS_VOICE: "${WA_ELEVENLABS_VOICE:-}"
      # Must handle Portuguese. An English-only model does not refuse it, it
      # reads it with an English mouth — which ships and sounds wrong.
      WA_ELEVENLABS_MODEL: "${WA_ELEVENLABS_MODEL:-eleven_multilingual_v2}"
      # Force one provider when both keys are present. Normally unset.
      WA_SPEECH_PROVIDER: "${WA_SPEECH_PROVIDER:-}"
      WA_SPEECH_VOICE: "${WA_SPEECH_VOICE:-}"
      WA_TRANSCRIBE_URL: "${WA_TRANSCRIBE_URL:-}"
      WA_TRANSCRIBE_MODEL: "${WA_TRANSCRIBE_MODEL:-gpt-transcribe}"
      # Only needed for a non-OpenAI endpoint. When WA_TRANSCRIBE_URL points at
      # api.openai.com the key below is inherited automatically — and it is
      # never sent anywhere else.
      WA_TRANSCRIBE_KEY: "${WA_TRANSCRIBE_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      # Image generation, from the same key. Unset leaves it unavailable, which
      # is a working state — no other tool depends on it. Only the prompt is
      # uploaded; no message and no image from a chat ever is.
      WA_IMAGE_MODEL: "${WA_IMAGE_MODEL:-gpt-image-1}"
      WA_IMAGE_QUALITY: "${WA_IMAGE_QUALITY:-medium}"
      WA_IMAGE_URL: "${WA_IMAGE_URL:-}"
      # Scratch space for a picture between being drawn and being sent. Inside
      # the container and deliberately not on a volume: a generated image is
      # kept only long enough to be looked at and sent.
      WA_IMAGE_DIR: "${WA_IMAGE_DIR:-/tmp/wa-images}"
      # Web search, through Brave. Unset leaves it unavailable, which is a
      # working state. Only the query is uploaded — no message, no contact.
      BRAVE_API_KEY: "${BRAVE_API_KEY:-}"
      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
      # Bias results to where the user actually is. Unset is Brave's US/English
      # default, which answers a local question with the wrong country's pages.
      WA_SEARCH_COUNTRY: "${WA_SEARCH_COUNTRY:-}"
      WA_SEARCH_LANG: "${WA_SEARCH_LANG:-}"
      WA_SEARCH_URL: "${WA_SEARCH_URL:-}"
      # Read-only calendar feed. The URL is a credential in its own right.
      WA_CALENDAR_ICS_URL: "${WA_CALENDAR_ICS_URL:-}"
      # The document renderer. Unset is a working state: the connection simply
      # fails when a tool is called, and nothing else in the agent depends on it.
      WA_FRAMEFORGE_MCP_URL: "${WA_FRAMEFORGE_MCP_URL:-http://frameforge:8110/mcp}"
      # Must match the renderer's FRAMEFORGE_MCP_SESSION_ROOT: it is the same
      # directory, mounted in both containers, and a render this agent cannot
      # find is a document the user never receives.
      WA_FRAMEFORGE_SESSION_ROOT: "${WA_FRAMEFORGE_SESSION_ROOT:-/work/sessions}"
      PORT: "3000"
      HOST: "0.0.0.0"
    volumes:
      # Read-only, and read-only is the point: the renderer writes its sessions
      # here and this agent only ever picks up the finished page. Nothing breaks
      # when the frameforge profile is not running — the directory is empty and
      # whatsapp_deliver_render says the render is gone.
      - frameforge-work:/work:ro
      # eve's checkpoint store. THIS is what makes a durable agent durable:
      # sessions, workflow runs and their events are written here, and without a
      # volume they live in the container's writable layer and are destroyed by
      # the next `up --build`.
      #
      # That is not theoretical — it is why an `/eve` conversation lost its
      # thread mid-sentence: a rebuild landed between two messages and took the
      # session with it, so the agent asked which joke the user meant while the
      # joke was on their screen. The framework was checkpointing correctly the
      # whole time; the deployment was throwing the checkpoints away.
      #
      # Scoped to `.workflow-data` rather than all of `.eve` deliberately: the
      # rest of that directory is BUILD output — agent-summary.json, builds,
      # cache — which must come from the image on every deploy. A volume over
      # `.eve` would pin a stale build and shadow the new one.
      #
      # Safe to mount because the Dockerfile creates the path as node:node; a
      # named volume seeds from the image, so it inherits that ownership. Mount
      # it at a path the image lacks and Docker creates it root-owned, which the
      # agent (uid 1000) cannot write to.
      - eve-workflow-data:/app/.eve/.workflow-data
      # The configuration file itself, writable, so the UI's Preferences screen
      # can change a setting without shell access to the host.
      #
      # ── What this widens, stated plainly ──────────────────────────────────
      # Anyone holding WA_UI_PASSWORD can now change the send allowlist, the
      # retention windows and every third-party endpoint. Before this mount that
      # required a shell on the host. The narrowing is that only the keys in
      # `agent/lib/ui-settings.ts` may be written — no token, no password, no
      # provider key, no service URL — and a write of anything else is refused
      # rather than appended.
      #
      # Two consequences worth knowing before you keep it:
      #   · A write here changes what the NEXT start reads. Nothing applies to a
      #     running process, and the screen says so per row rather than
      #     pretending a toggle took effect.
      #   · Remove this line and the whole screen becomes read-only, which is a
      #     supported posture, not a broken one.
      #
      # `.env` must EXIST before the first `up`. Docker creates a missing bind
      # source as a DIRECTORY, and a directory at /app/.env reads as an
      # unreadable file for ever after — `cp .env.example .env` first.
      - ./.env:/app/.env:rw
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - internal

volumes:
  whatsapp-profile:
  # Holds session.db (the linked session) and outbox.db (undrained messages).
  # Treat it as you would a private key.
  whatsapp-transport-data:
  # Render scratch space, shared between the renderer (read-write) and the agent
  # (read-only). Ephemeral by nature: sessions are overwritten and cleaned up.
  frameforge-work:
  # eve's durable state: session continuations, workflow runs, their events and
  # the hook token index. Deleting this volume does not break the agent — it
  # forgets every conversation in progress, which is the same thing a rebuild
  # used to do on its own.
  eve-workflow-data:

networks:
  internal:
    driver: bridge
